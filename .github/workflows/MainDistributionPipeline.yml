#
# VestBrain lockstep candidate build: vss against core 8806a9f (the SHA
# upstream duckdb-fts declares in .github/duckdb-version). Build-only —
# deploy removed; artifacts are retrieved from the run, signed/published
# via getsoftware.vestfin.com out-of-band.
#
name: Main Extension Distribution Pipeline
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  duckdb-candidate-build:
    name: Build vss against core 8806a9f
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@main
    with:
      extension_name: vss
      duckdb_version: 8806a9f8638cf876f979762a8161c83a02ea9bc6
      ci_tools_version: main
      exclude_archs: "wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw"
