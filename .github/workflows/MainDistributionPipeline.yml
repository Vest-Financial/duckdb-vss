#
# VestBrain lockstep candidate: vss against core a00803f (fts-declared pin).
# linux_amd64 ONLY — the platform prod ships. arm64 cross-compile failed in
# run 34478817262 (fail-fast cancelled amd64 before it answered); scoping to
# the lane that matters. Build-only; artifacts published out-of-band.
#
name: Main Extension Distribution Pipeline
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  duckdb-candidate-build:
    name: Build vss against core a00803f
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@main
    with:
      extension_name: vss
      duckdb_version: a00803f7687ca3d7188d417216e288c5c4b22b58
      ci_tools_version: main
      exclude_archs: "wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;windows_amd64;osx_amd64;osx_arm64;linux_arm64;linux_amd64_musl"
