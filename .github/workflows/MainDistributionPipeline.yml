#
# VestBrain lockstep candidate: vss against core 8806a9f (fts-declared pin).
# linux_amd64 ONLY — the platform prod ships. July-era vss (pre Sept-2 interface adaptation) — matches the old
# core index interface that 8806a9f still carries (bound_index.hpp churn
# starts 2026-08-03). Build-only, linux_amd64 only.
#
name: Main Extension Distribution Pipeline
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  duckdb-candidate-build:
    name: Build vss against core 8806a9f
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@main
    with:
      extension_name: vss
      duckdb_version: 8806a9f8638cf876f979762a8161c83a02ea9bc6
      ci_tools_version: main
      exclude_archs: "wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;windows_amd64;osx_amd64;osx_arm64;linux_arm64;linux_amd64_musl"
